<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="180" r="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(37,99,235,0.18)" />
      <stop offset="100%" stop-color="rgba(2,6,23,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="600" cy="180" r="450" fill="url(#glow)" />

  <!-- Subtle Coordinate Grid Background Lines -->
  <line x1="120" y1="460" x2="1080" y2="460" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <line x1="120" y1="380" x2="1080" y2="380" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="120" y1="300" x2="1080" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="600" y1="180" x2="600" y2="460" stroke="rgba(56,189,248,0.25)" stroke-width="2" stroke-dasharray="6 6" />

  <!-- StatMetric Logo Symbol (Centered at top) -->
  <g transform="translate(540, 110)">
    <rect x="0" y="0" width="120" height="120" rx="26" fill="#0f172a" stroke="rgba(255,255,255,0.16)" stroke-width="3" />
    <line x1="22" y1="88" x2="98" y2="88" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="28" x2="60" y2="88" stroke="rgba(56,189,248,0.5)" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="42" y1="83" x2="42" y2="93" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="78" y1="83" x2="78" y2="93" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />
    <path d="M 22 88 C 36 88, 44 80, 50 56 C 55 33, 58 30, 60 30 C 62 30, 65 33, 70 56 C 76 80, 84 88, 98 88" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="60" cy="30" r="7" fill="#60a5fa" stroke="#020617" stroke-width="3" />
  </g>

  <!-- Typography: Wordmark & Tagline -->
  <text x="600" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Stat<tspan fill="#38bdf8">Metric</tspan>
  </text>

  <text x="600" y="355" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#94a3b8">
    Free Open Quantitative Computing &amp; Statistical Toolkit
  </text>

  <text x="600" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#64748b">
    Mathematics · Empirical Research · Probability · Education · Conversion
  </text>

  <!-- Badges / Pillars -->
  <g transform="translate(230, 500)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="110" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">
      Peer-Reviewed Math
    </text>
  </g>

  <g transform="translate(490, 500)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="110" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">
      100% Client-Side Privacy
    </text>
  </g>

  <g transform="translate(750, 500)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="110" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">
      Verified Zero Telemetry
    </text>
  </g>
</svg>
